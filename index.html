<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ค้นหาสินค้า</title>
<link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml">
<link rel="icon" href="assets/logo-mark-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/logo-mark-180.png">
<meta name="theme-color" content="#c2410c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen app — search bar (top) / force graph (center) / horizontal product strip (bottom); cart drawer slides from right */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --ink:#1f2a2e; --muted:#62707a; --line:#d9dedd;
  --accent:#e06a1b; --accent-ink:#ffffff;
  --group:#2f6f8f; --prod:#7d8b93; --buy:#e06a1b; --query:#1f2a2e;
  --good:#2e7d4f; --soft:#eef1f0; --shadow:0 6px 24px rgba(20,35,40,.12);
  --f-body:"IBM Plex Sans Thai",system-ui,"Noto Sans Thai",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --brand-1:#000000; --brand-2:#c2410c;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a1d; --surface:#1d2529; --ink:#e7ecec; --muted:#97a4ab; --line:#2f3a3f;
  --accent:#f08436; --accent-ink:#1a1206; --group:#5ea9cc; --prod:#8d9aa1; --buy:#f08436; --query:#e7ecec;
  --good:#5fbf86; --soft:#242e33; --brand-1:#f2f2f2; --brand-2:#f97316; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141a1d; --surface:#1d2529; --ink:#e7ecec; --muted:#97a4ab; --line:#2f3a3f;
  --accent:#f08436; --accent-ink:#1a1206; --group:#5ea9cc; --prod:#8d9aa1; --buy:#f08436; --query:#e7ecec;
  --good:#5fbf86; --soft:#242e33; --brand-1:#f2f2f2; --brand-2:#f97316; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- top ---------- */
header{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 20px 10px;display:grid;gap:8px;grid-template-columns:minmax(0,1fr);z-index:3}
.bar{display:flex;gap:12px;align-items:center}
.brandwrap{display:flex;gap:10px;align-items:center}
.mark{width:40px;height:40px;flex:0 0 40px;display:block}
.brand{white-space:nowrap;display:grid;line-height:1.15}
.brand .nm{font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand .k1{color:var(--brand-1)}
.brand .k2{color:var(--brand-2)}
.brand .by{font-size:11.5px;color:var(--muted)}
.search{flex:1;position:relative;max-width:760px;min-width:0}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 44px 11px 42px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;padding:6px 10px;color:var(--muted);border-radius:6px}
.cartbtn{margin-left:auto;display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-weight:600;white-space:nowrap}
.cartbtn .badge{background:var(--accent);color:var(--accent-ink);border-radius:99px;min-width:22px;padding:0 6px;font-size:13px;text-align:center;font-family:var(--f-mono)}
.sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tryrow{display:contents}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 11px;font-size:13px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.summary{margin-left:auto}
.summary b{color:var(--ink)}
.fz{background:var(--soft);color:var(--ink);border-radius:6px;padding:1px 8px}

/* ---------- graph ---------- */
main{position:relative;min-height:0}
#graph{width:100%;height:100%;display:block;cursor:grab}
#graph:active{cursor:grabbing}
.legend{position:absolute;left:16px;top:14px;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;display:grid;gap:4px;backdrop-filter:blur(4px)}
.legend span{display:flex;align-items:center;gap:8px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.legend .line{width:18px;border-top:2px dashed var(--buy)}
.tools{position:absolute;left:16px;bottom:14px;display:flex;gap:6px;z-index:2}
.tools button{display:flex;align-items:center;gap:6px}
.tools button[aria-expanded="true"]{border-color:var(--brand-2);color:var(--brand-2)}
/* unit converter window */
.conv{position:absolute;left:16px;bottom:52px;width:330px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--brand-2);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px 14px;z-index:5;display:grid;gap:10px;font-size:13.5px}
.conv .chd{display:flex;justify-content:space-between;align-items:center}
.conv .chd b{font-size:15px}
.conv .chd button{border:0;background:var(--soft);border-radius:7px;width:28px;height:28px}
.cvrow{display:grid;grid-template-columns:1fr auto;gap:6px}
.cvrow input,.cvrow select,.cvto select{font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--bg);color:var(--ink);min-width:0}
.cvrow input{font-family:var(--f-mono);font-size:17px}
.cvrow input:focus,.cvrow select:focus,.cvto select:focus{outline:none;border-color:var(--brand-2)}
.cvto{display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:center}
.cvswap{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:38px;height:38px;font-size:17px}
.cvres{background:var(--soft);border-radius:10px;padding:10px 12px}
.cvres .big{font-family:var(--f-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;word-break:break-all}
.cvres .big small{font-family:var(--f-body);font-size:14px;font-weight:500;color:var(--muted)}
.cvres .alt{font-size:13px;color:var(--muted)}
.cvpre{display:flex;flex-wrap:wrap;gap:5px}
.cvpre button{border:1px solid var(--line);background:none;border-radius:99px;padding:1px 10px;font-size:12.5px}
.cvpre button:hover{border-color:var(--brand-2);color:var(--brand-2)}
.cvall{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12.5px;color:var(--muted)}
.cvall span:nth-child(even){font-family:var(--f-mono);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
/* full-screen item list */
.tab .exp{margin-left:5px;vertical-align:-2px;opacity:.7}
.fs{position:fixed;inset:0;z-index:8;background:var(--bg);display:grid;grid-template-rows:auto auto 1fr;grid-template-columns:minmax(0,1fr)}
.fshead{display:flex;gap:12px;align-items:center;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.fshead .back{border:1px solid var(--line);background:var(--bg);border-radius:9px;height:38px;padding:0 12px;font-weight:600;display:flex;gap:6px;align-items:center;white-space:nowrap}
.fstitle{flex:1;min-width:0;display:grid;line-height:1.3}
.fstitle b{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fstitle span{font-size:12.5px;color:var(--muted)}
.fsbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.fsbar input,.fsbar select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg);color:var(--ink);min-width:0}
.fsbar input{flex:1 1 200px}
.fsbar input:focus,.fsbar select:focus{outline:none;border-color:var(--accent)}
.scope{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap}
.scope button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:0 9px;font-size:12.5px}
.fsgrid{overflow:auto;padding:16px 20px 28px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;align-content:start}
.fsgrid .card{cursor:pointer}
.fsgrid .more{min-height:120px;grid-column:1/-1}
.fsgrid .none{grid-column:1/-1}
.tools button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:13px}
.info{position:absolute;right:16px;top:14px;width:min(340px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--group);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);font-size:13.5px;max-height:calc(100% - 28px);overflow:auto}
.info.buy{border-left-color:var(--buy)}
.info h3{margin:0 0 2px;font-size:16px;text-wrap:balance}
.ihead{display:flex;gap:10px;align-items:flex-start;cursor:pointer;position:sticky;top:-12px;margin:-12px -14px 0;padding:12px 14px 6px;background:var(--surface);z-index:1;border-radius:10px 10px 0 0}
.ititle{flex:1;min-width:0}
.imin{flex:0 0 28px;height:28px;border-radius:7px;background:var(--soft);display:grid;place-items:center;color:var(--muted);transition:transform .2s}
.ihead:hover .imin{color:var(--ink)}
.info.min{padding-bottom:0;overflow:hidden}
.info.min .ihead{padding-bottom:10px;border-radius:10px}
.info.min .ibody{display:none}
.info.min .imin{transform:rotate(180deg)}
.info.min h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}
.info .cat{color:var(--muted);font-size:12px}
.info dl{margin:8px 0 0;display:grid;gap:6px}
.info dt{font-size:11.5px;color:var(--muted);font-weight:600}
.info dd{margin:0}
.syns{display:flex;flex-wrap:wrap;gap:4px}
.syns span{background:var(--soft);border-radius:5px;padding:0 6px;font-size:12px}
.syns mark{background:color-mix(in srgb,var(--accent) 25%,transparent);color:inherit;border-radius:3px}
.buylist{display:flex;flex-wrap:wrap;gap:5px}
.buylist button{border:1px dashed var(--buy);background:none;color:var(--ink);border-radius:99px;padding:1px 9px;font-size:12.5px}
.buylist button:hover{background:color-mix(in srgb,var(--buy) 12%,transparent)}
.buylist .miss{border:1px dashed var(--line);color:var(--muted);border-radius:99px;padding:1px 9px;font-size:12.5px}
.loading{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:var(--bg);z-index:4;color:var(--muted)}
.loading>div{display:grid;gap:6px;justify-items:center}
.loading b{color:var(--ink);font-size:17px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand-2);border-radius:50%;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.upd{font-size:12px;color:var(--muted);white-space:nowrap}
.upd.off{color:var(--brand-2)}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);pointer-events:none}
.empty b{display:block;color:var(--ink);font-size:18px}

svg text{font-family:var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.node{cursor:pointer}
.node circle{stroke:var(--bg);stroke-width:2.5px;transition:r .2s}
.node.q circle{fill:var(--query)}
.node.q text{fill:var(--bg);stroke:none;font-weight:700}
.node.g circle{fill:var(--group)}
.node.p circle{fill:var(--prod)}
.node.b circle{fill:var(--buy)}
.node.sel circle{stroke:var(--accent);stroke-width:4px}
.node.hl circle{stroke:var(--ink);stroke-width:3.5px}
.node .cnt{font-family:var(--f-mono);font-size:10.5px;fill:#fff;stroke:none;font-weight:600}
.link{stroke:var(--line);stroke-width:1.5px}
.link.qg{stroke:color-mix(in srgb,var(--group) 45%,var(--line));stroke-width:2px}
.link.buy{stroke:var(--buy);stroke-dasharray:5 4;stroke-width:1.8px}

/* ---------- bottom strip ---------- */
footer{background:var(--surface);border-top:1px solid var(--line);padding:10px 0 12px;z-index:3;min-width:0}
.tabs{display:flex;gap:4px;padding:0 20px 8px;align-items:center}
.tab{border:0;background:none;padding:4px 12px;border-radius:8px;font-weight:600;color:var(--muted);font-size:14px}
.tab[aria-selected="true"]{background:var(--soft);color:var(--ink)}
.tab[aria-selected="true"].buyt{box-shadow:inset 0 -2px 0 var(--buy)}
.tab .n{font-family:var(--f-mono);font-size:12px;margin-left:4px}
.filter{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.filter button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:0 9px;font-size:12.5px}
.nav{margin-left:auto;display:flex;gap:6px}
.nav button{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:34px;height:30px}
.strip{display:flex;gap:12px;overflow-x:auto;padding:4px 20px 6px;scroll-snap-type:x proximity;scrollbar-width:thin}
.card{flex:0 0 232px;scroll-snap-align:start;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;display:grid;grid-template-rows:auto auto 1fr auto;gap:4px;transition:border-color .2s,box-shadow .2s}
.card.hl{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.card .top{display:flex;justify-content:space-between;gap:6px;align-items:center}
.code{font-family:var(--f-mono);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel{font-size:11px;border-radius:99px;padding:0 7px;white-space:nowrap;font-weight:600}
.rel.r3{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.rel.r2{background:color-mix(in srgb,var(--group) 16%,transparent);color:var(--group)}
.rel.r1{background:var(--soft);color:var(--muted)}
.rel.rb{background:color-mix(in srgb,var(--buy) 15%,transparent);color:var(--buy)}
.card h4{margin:0;font-size:14px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.card .grp{font-size:12px;line-height:1.5;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .mid{display:flex;gap:8px;align-items:center;min-width:0}
.thumb{width:44px;height:44px;flex:0 0 44px;border-radius:8px;object-fit:cover;background:var(--soft);border:1px solid var(--line)}
.card .grp{flex:1;min-width:0}
.view{border:0;background:none;padding:0;font-size:12.5px;color:var(--group);text-decoration:underline;text-underline-offset:2px;justify-self:start}
.info .gimg{width:100%;max-height:150px;object-fit:cover;border-radius:8px;margin:8px 0 0;background:var(--soft)}
.modal{position:fixed;inset:0;z-index:15;display:grid;place-items:center;padding:16px}
.modal .bd{position:absolute;inset:0;background:rgba(10,20,25,.55)}
.mbox{position:relative;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(820px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:1.15fr 1fr}
.mimg{background:var(--soft);display:grid;place-items:center;min-height:320px;position:relative}
.mimg img{width:100%;height:100%;max-height:70vh;object-fit:contain;display:block}
.noimg{display:grid;gap:6px;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:24px}
.mimg .src{position:absolute;left:10px;bottom:10px;background:var(--surface);border-radius:6px;padding:1px 8px;font-size:12px;color:var(--muted)}
.mdet{padding:20px 22px;display:grid;gap:10px;align-content:start}
.mdet h3{margin:0;font-size:19px;line-height:1.35;text-wrap:balance}
.mdet .price{font-size:24px}
.mdet dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.mdet dt{color:var(--muted)}
.mdet dd{margin:0}
.mdet .acts{display:flex;gap:8px;margin-top:6px}
.mdet .acts button{padding:9px 14px;border-radius:9px;font-weight:600}
.mclose{position:absolute;right:10px;top:10px;z-index:2}
.mnav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:var(--surface);width:36px;height:36px;border-radius:50%;box-shadow:var(--shadow);font-size:20px}
.mnav.l{left:10px}.mnav.r{right:10px}
@media (max-width:720px){.mbox{grid-template-columns:1fr}.mimg{min-height:220px}}
.pr{display:grid;gap:0;min-width:0}
.card .price{font-size:16.5px;white-space:nowrap}
.calc{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.formula{font-size:12.5px;background:var(--soft);border-radius:8px;padding:8px 10px;color:var(--muted);line-height:1.6}
.formula b{color:var(--ink);font-family:var(--f-mono)}
.card .row{display:flex;justify-content:space-between;align-items:end;gap:8px;margin-top:4px}
.price{font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.price small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400}
.price.ask{font-family:var(--f-body);font-size:13.5px;color:var(--muted);font-weight:500}
.add{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:5px 11px;font-weight:600;font-size:13px;white-space:nowrap}
.add.in{background:var(--good);color:#fff}
.more{flex:0 0 160px;border:1px dashed var(--line);border-radius:12px;background:none;color:var(--muted)}
.none{padding:18px 20px;color:var(--muted)}

/* ---------- cart ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,20,25,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:var(--surface);box-shadow:var(--shadow);transform:translateX(100%);transition:transform .25s;z-index:10;display:grid;grid-template-rows:auto 1fr auto}
body.cart-open .scrim{opacity:1;pointer-events:auto}
body.cart-open .drawer{transform:none}
.drawer header{border:0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:16px 20px}
.drawer h2{margin:0;font-size:18px}
.x{border:0;background:var(--soft);border-radius:8px;width:34px;height:34px;font-size:18px}
.items{overflow:auto;padding:8px 20px;display:grid;gap:10px;align-content:start}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;border-bottom:1px solid var(--line);padding-bottom:10px}
.item .nm{font-weight:600;font-size:14px}
.item .meta{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.item .lt{font-family:var(--f-mono);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:2px}
.qty button{border:1px solid var(--line);background:var(--bg);width:28px;height:28px;border-radius:7px}
.qty input{width:48px;text-align:center;font:inherit;font-family:var(--f-mono);border:1px solid var(--line);border-radius:7px;height:28px;background:var(--bg);color:var(--ink)}
.rm{border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;justify-self:end}
.tot{border-top:1px solid var(--line);padding:14px 20px 18px;display:grid;gap:8px}
.tot .sum{display:flex;justify-content:space-between;font-size:15px}
.tot .sum b{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.tot .note{font-size:12.5px;color:var(--muted)}
.tot .acts{display:flex;gap:8px}
.tot .acts button{flex:1;padding:10px;border-radius:9px;font-weight:600}
.primary{border:0;background:var(--accent);color:var(--accent-ink)}
.ghost{border:1px solid var(--line);background:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:9px;font-size:14px;transition:.2s;z-index:20;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}

<script>
(async function(){
const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString('th-TH',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});
const norm=s=>(s||'').toLowerCase().replace(/[\s\-_/().,"']/g,'');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cut=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;

/* ---------- data ---------- */
/* ---------- load: live Apps Script API → cached copy → bundled data.json ---------- */
const CFG=Object.assign({DATA_URL:'',FALLBACK_URL:'data.json',CACHE_MINUTES:5},window.APP_CONFIG||{});
const LS='shop-data-v1';
async function getJSON(u,opt){const r=await fetch(u,opt); if(!r.ok) throw new Error('HTTP '+r.status); const d=await r.json(); if(d.error) throw new Error(d.error); if(!Array.isArray(d.products)||!Array.isArray(d.groups)) throw new Error('bad data'); return d;}
async function loadData(){
  let cached=null; try{cached=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}
  if(CFG.DATA_URL){
    if(cached&&Date.now()-cached.t<CFG.CACHE_MINUTES*60000) return {raw:cached.d,src:'live'};
    try{ const d=await getJSON(CFG.DATA_URL,{cache:'no-store'}); try{localStorage.setItem(LS,JSON.stringify({t:Date.now(),d}))}catch(e){} return {raw:d,src:'live'}; }
    catch(e){ console.warn('Live data failed:',e); if(cached) return {raw:cached.d,src:'cache'}; }
  }
  return {raw:await getJSON(CFG.FALLBACK_URL),src:CFG.DATA_URL?'fallback':'file'};
}
/* link ซื้อคู่กัน names to real groups: exact → ignore spacing/punctuation → unique containment → close spelling (≥80%) */
function buildFromRaw(raw){
  const nk=x=>(x||'').toLowerCase().replace(/[\s\-_/().,]/g,'');
  const names=raw.groups.map(r=>String(r[0]).trim()), nn=names.map(nk);
  const idx=new Map(names.map((n,i)=>[n,i])), nidx=new Map(); nn.forEach((k,i)=>{if(!nidx.has(k))nidx.set(k,i)});
  const lev=(a,b)=>{const m=a.length,n=b.length; let p=Array.from({length:n+1},(_,j)=>j);
    for(let i=1;i<=m;i++){const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c;} return p[n];};
  const memo=new Map();
  const resolve=x=>{ if(memo.has(x)) return memo.get(x); let r=null;
    if(idx.has(x)) r=idx.get(x); else { const k=nk(x);
      if(nidx.has(k)) r=nidx.get(k);
      else { const c=k.length>=3?nn.map((v,i)=>v.length>=3&&(v.includes(k)||k.includes(v))?i:-1).filter(i=>i>=0):[];
        if(c.length===1) r=c[0];
        else { let best=-1,bs=.8; nn.forEach((v,i)=>{ const L=k.length+v.length; if(!L||Math.abs(k.length-v.length)/L>.2) return;
            const sc=(L-lev(k,v))/L; if(sc>=bs){bs=sc;best=i} }); if(best>=0) r=best; } } }
    memo.set(x,r); return r; };
  const groups=raw.groups.map((r,gi)=>{ const b=[],m=[];
    for(const x of String(r[5]||'').split(/\s*,\s+/).map(t=>t.trim()).filter(Boolean)){
      if(x==='ไม่แน่ใจ') continue; const i=resolve(x); if(i==null) m.push(x); else if(!b.includes(i)) b.push(i); }
    return {n:names[gi],c:String(r[1]||'').split('_')[0].replace(/^หมวด/,''),syn:r[2]||'',w:r[3]||'',d:r[4]||'',b,m}; });
  const products=raw.products.map(([code,name,price,unit,gname,rate])=>[String(code),String(name),+price||0,unit||'',idx.has(String(gname).trim())?idx.get(String(gname).trim()):-1,+rate||0]);
  return {groups,products,updated:raw.updated};
}
let LOADED;
try{ LOADED=await loadData(); }
catch(e){ $('#loading').innerHTML='<div><b>โหลดข้อมูลสินค้าไม่สำเร็จ</b><span>ตรวจสอบอินเทอร์เน็ต แล้วรีเฟรชหน้านี้อีกครั้ง</span></div>'; console.error(e); return; }
const DATA=buildFromRaw(LOADED.raw);
{ const u=$('#upd'); const t=DATA.updated?new Date(DATA.updated):null;
  const ts=t&&!isNaN(t)?t.toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'}):'';
  u.textContent=LOADED.src==='live'?(ts?'ข้อมูล ณ '+ts:''):LOADED.src==='cache'?'ออฟไลน์ · แสดงข้อมูลล่าสุดที่บันทึกไว้':LOADED.src==='fallback'?'เชื่อมต่อข้อมูลล่าสุดไม่ได้ · แสดงข้อมูลสำรอง':(ts?'ข้อมูล ณ '+ts:'');
  if(LOADED.src==='cache'||LOADED.src==='fallback') u.classList.add('off'); }
$('#loading').hidden=true;
const G=DATA.groups.map((g,i)=>({...g,i,syns:g.syn?g.syn.split(/\s*,\s*/).filter(Boolean):[],prods:[]}));
G.forEach(g=>{g.nSyn=g.syns.map(norm);g.nN=norm(g.n);g.nW=norm(g.w);g.nD=norm(g.d)});
const P=DATA.products.map(([code,name,price,unit,gi,rate],i)=>({i,code,name,price,unit,gi,rate:rate||0,nName:norm(name),nCode:norm(code)}));
/* Wood priced by volume: AMT = QTY2_RATE × qty × PRICE_3 (PRICE_3 = price per ลบ.ฟ.) */
const r2=n=>Math.round(n*100)/100;
const amt=(p,q)=>p.rate>0?r2(p.rate*q*p.price):r2(p.price*q);
const rateTxt=p=>p.rate>0?`${p.rate.toLocaleString('th-TH',{maximumFractionDigits:4})} ลบ.ฟ. × ฿${fmt(p.price)}`:'';
const priceHTML=p=>p.price>0?`<span class="price">฿${fmt(amt(p,1))} <small>/${esc(p.unit||'หน่วย')}</small></span>`:'<span class="price ask">สอบถามราคา</span>';
P.forEach(p=>{if(p.gi>=0)G[p.gi].prods.push(p)});
G.forEach(g=>g.prods.sort((a,b)=>(b.price>0)-(a.price>0)||a.name.localeCompare(b.name,'th')));
const seenC=new Map(); P.forEach(p=>{const n=seenC.get(p.code)||0; p.key=n?p.code+'~'+n:p.code; seenC.set(p.code,n+1)});
const byCode=new Map(P.map(p=>[p.key,p]));
/* images.json: {"p":{"CODE":"img/...webp"}, "g":{"ชื่อกลุ่ม":"img/g/...webp"}} — path or full URL */
let IMG={p:{},g:{}}; try{const r=await fetch('images.json'); if(r.ok) IMG=Object.assign(IMG,await r.json())}catch(e){}
const imgFor=p=>IMG.p[p.code]?{src:IMG.p[p.code],own:true}:(p.gi>=0&&IMG.g[G[p.gi].n]?{src:IMG.g[G[p.gi].n],own:false}:null);
let fuseG=null,fuseP=null;
const fuse=()=>{ if(!fuseG&&window.Fuse){
  fuseG=new Fuse(G,{keys:[{name:'syns',weight:3},{name:'n',weight:3},{name:'w',weight:1.5},{name:'d',weight:1}],threshold:.38,ignoreLocation:true,includeScore:true});
  fuseP=new Fuse(P,{keys:['name','code'],threshold:.34,ignoreLocation:true,includeScore:true});}};

/* ---------- search: linear scan with weighted fields, fuzzy fallback ---------- */
function search(raw){
  const q=raw.trim(); if(!q) return null;
  let toks=q.split(/[\s,]+/).map(norm).filter(Boolean);
  if(toks.length>1) toks.push(norm(q));
  const gScore=new Float32Array(G.length);
  for(const g of G){ let s=0,hit=0;
    /* Thai names put the main word first: "เหล็กเพส" is steel, "ดอกเจาะเหล็ก" is a drill bit for steel.
       So a name or synonym that STARTS with the word scores much higher than one that only contains it. */
    for(const t of toks){ let b=0;
      if(g.nN===t||g.nSyn.includes(t)) b=14;
      else if(g.nN.startsWith(t)) b=13;
      else if(g.nSyn.some(x=>x.startsWith(t))) b=11;
      else if(g.nN.includes(t)) b=6;
      else if(g.nSyn.some(x=>x.includes(t))) b=5;
      else if(g.nW.includes(t)) b=4;
      else if(g.nD.includes(t)) b=2;
      if(b){s+=b;hit++} }
    if(hit===toks.length && toks.length>1) s*=1.4;
    gScore[g.i]=s; }
  const res=[];
  for(const p of P){ let own=0;
    for(const t of toks){ if(p.nCode===t) own+=30; else if(t.length>=3&&p.nCode.startsWith(t)) own+=14;
      else if(p.nName.startsWith(t)) own+=16;
      else if(p.nName.includes(t)) own+=7; }
    const gs=p.gi>=0?gScore[p.gi]:0;
    const s=own+gs*.6; if(s>0) res.push({p,s,own}); }
  let fuzzy=false;
  if(!res.length){ fuse(); if(fuseG){ fuzzy=true;
      for(const r of fuseG.search(q,{limit:8})) gScore[r.item.i]=Math.max(gScore[r.item.i],8*(1-r.score));
      const seen=new Set();
      for(const r of fuseP.search(q,{limit:60})){ seen.add(r.item.i); res.push({p:r.item,s:10*(1-r.score),own:1}); }
      for(const g of G) if(gScore[g.i]>0) for(const p of g.prods) if(!seen.has(p.i)) res.push({p,s:gScore[g.i]*.8,own:0}); } }
  res.sort((a,b)=>b.s-a.s||(b.p.price>0)-(a.p.price>0)||a.p.name.length-b.p.name.length);
  const max=res.length?res[0].s:1;
  res.forEach(r=>r.rel=r.s/max);
  // groups ranked: own group score + best product hit in group
  const gAgg=new Map();
  for(const r of res){ if(r.p.gi<0) continue; const cur=gAgg.get(r.p.gi)||{s:gScore[r.p.gi],n:0};
    cur.n++; if(r.own) cur.s=Math.max(cur.s,gScore[r.p.gi]+Math.min(r.own,16)*.6); gAgg.set(r.p.gi,cur); }
  const groups=[...gAgg].map(([gi,v])=>({g:G[gi],s:v.s,n:v.n})).sort((a,b)=>b.s-a.s||b.n-a.n);
  return {q,toks,res,groups,fuzzy};
}

/* ---------- state ---------- */
let R=null, focus=null, tab='res', hlCode=null, shown=120;
let cart={}; try{cart=JSON.parse(localStorage.getItem('cart-v2')||'{}')}catch(e){}
const saveCart=()=>{try{localStorage.setItem('cart-v2',JSON.stringify(cart))}catch(e){}};

/* ---------- graph ---------- */
const svg=d3.select('#graph'), root=svg.append('g');
const gLinks=root.append('g'), gNodes=root.append('g');
const zoom=d3.zoom().scaleExtent([.3,3]).on('zoom',e=>root.attr('transform',e.transform));
svg.call(zoom).on('dblclick.zoom',null);
let nodes=[],links=[],nodeById=new Map();
const sim=d3.forceSimulation().force('charge',d3.forceManyBody().strength(d=>d.t==='p'?-120:-600))
  .force('link',d3.forceLink().id(d=>d.id).distance(l=>l.k==='qg'?190:l.k==='buy'?170:70).strength(l=>l.k==='buy'?.35:.8))
  .force('collide',d3.forceCollide().radius(d=>d.r+(d.t==='p'?18:34)))
  .force('x',d3.forceX(0).strength(.04)).force('y',d3.forceY(0).strength(.06))
  .on('tick',ticked);

function size(){const b=svg.node().getBoundingClientRect();return [b.width,b.height]}
function fit(dur=600){ if(!nodes.length) return; const [w,h]=size();
  const xs=nodes.map(n=>n.x),ys=nodes.map(n=>n.y);
  const x0=Math.min(...xs)-90,x1=Math.max(...xs)+90,y0=Math.min(...ys)-50,y1=Math.max(...ys)+50;
  const k=Math.min(1.6,Math.max(.35,Math.min(w/(x1-x0),h/(y1-y0))));
  const t=d3.zoomIdentity.translate(w/2-k*(x0+x1)/2,h/2-k*(y0+y1)/2).scale(k);
  svg.transition().duration(dur).call(zoom.transform,t); }

function build(){
  const old=nodeById; nodeById=new Map(); nodes=[]; links=[];
  const add=(n)=>{ const o=old.get(n.id); if(o){n.x=o.x;n.y=o.y;n.vx=o.vx;n.vy=o.vy} nodes.push(n); nodeById.set(n.id,n); return n;};
  if(!R||!R.res.length){ render(); return; }
  add({id:'q',t:'q',label:cut(R.q,16),r:30,fx:0,fy:0});
  const top=R.groups.slice(0,7);
  if(focus!=null && !top.some(x=>x.g.i===focus)){ const f=R.groups.find(x=>x.g.i===focus); top.push(f||{g:G[focus],s:0,n:G[focus].prods.length,ext:true}); }
  const hit=new Set(R.res.map(r=>r.p.i));
  top.forEach((x,k)=>{ const g=x.g, isF=g.i===focus;
    const gid='g'+g.i;
    if(!x.ext) { add({id:gid,t:'g',gi:g.i,label:cut(g.n,22),r:isF?24:16+Math.min(8,x.n/6),cnt:g.prods.length}); links.push({source:'q',target:gid,k:'qg'}); }
    else { add({id:gid,t:'b',gi:g.i,label:cut(g.n,22),r:20,cnt:g.prods.length});
      const par=top.find(y=>!y.ext&&y.g.b.includes(g.i)); links.push(par?{source:'g'+par.g.i,target:gid,k:'buy'}:{source:'q',target:gid,k:'qg'}); }
    const lim=isF?8:(k<3?5:3);
    const ps=g.prods.filter(p=>hit.has(p.i)).slice(0,lim);
    if(ps.length<lim) for(const p of g.prods){ if(ps.length>=lim) break; if(!ps.includes(p)) ps.push(p); }
    ps.forEach(p=>{ const pid='p'+p.i; add({id:pid,t:'p',pi:p.i,gi:g.i,label:cut(p.name,20),r:7}); links.push({source:gid,target:pid,k:'gp'}); });
  });
  // buy-together nodes for focused group
  const fg=focus!=null?G[focus]:null;
  if(fg) fg.b.slice(0,8).forEach(bi=>{ const id='g'+bi;
    if(!nodeById.has(id)) add({id,t:'b',gi:bi,label:cut(G[bi].n,22),r:15,cnt:G[bi].prods.length});
    links.push({source:'g'+fg.i,target:id,k:'buy'}); });
  render();
}
function render(){
  $('#empty').hidden=!!(R&&R.res.length)||!R;
  const L=gLinks.selectAll('line').data(links,d=>(d.source.id||d.source)+'>'+(d.target.id||d.target));
  L.exit().remove();
  L.enter().append('line').merge(L).attr('class',d=>'link '+d.k);
  const N=gNodes.selectAll('g.node').data(nodes,d=>d.id);
  N.exit().remove();
  const E=N.enter().append('g').attr('class',d=>'node '+d.t).attr('tabindex',0)
    .on('click',(e,d)=>onNode(d)).on('keydown',(e,d)=>{if(e.key==='Enter')onNode(d)})
    .call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.2).restart();d.fx=d.x;d.fy=d.y})
      .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);if(d.t!=='q'){d.fx=null;d.fy=null}}));
  E.append('circle'); E.append('text').attr('class','lbl'); E.append('text').attr('class','cnt').attr('text-anchor','middle').attr('dy','.35em');
  E.append('title');
  const M=E.merge(N);
  M.attr('class',d=>'node '+d.t+((d.gi===focus&&d.t!=='p')?' sel':'')+(d.pi!=null&&P[d.pi].key===hlCode?' hl':''));
  M.select('circle').attr('r',d=>d.r);
  M.select('text.lbl').text(d=>d.t==='p'&&d.gi!==focus?'':d.label)
    .attr('text-anchor',d=>d.t==='q'?'middle':'start').attr('dy',d=>d.t==='q'?'.35em':'.35em')
    .attr('x',d=>d.t==='q'?0:d.r+5).attr('font-size',d=>d.t==='p'?11.5:d.t==='q'?13:13.5).attr('font-weight',d=>d.t==='p'?400:600);
  M.select('text.cnt').text(d=>(d.t==='g'||d.t==='b')&&d.r>=15?(d.cnt>99?'99+':d.cnt):'');
  M.select('title').text(d=>d.t==='p'?`${P[d.pi].name} (${P[d.pi].code})`:d.t==='q'?R.q:`${G[d.gi].n} — ${G[d.gi].prods.length} รายการ`);
  sim.nodes(nodes); sim.force('link').links(links); sim.alpha(.9).restart();
  clearTimeout(render.t); render.t=setTimeout(()=>fit(),700);
}
function ticked(){
  gLinks.selectAll('line').attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  gNodes.selectAll('g.node').attr('transform',d=>`translate(${d.x},${d.y})`);
}
function onNode(d){
  if(d.t==='q'){ setFocus(null); return; }
  if(d.t==='p'){ const p=P[d.pi]; if(hlCode===p.key){ openModal(p.key); return; } if(focus!==p.gi) setFocus(p.gi,false); highlight(p.key); return; }
  setFocus(d.gi);
}
function setFocus(gi,resetHl=true){
  focus=gi; if(resetHl) hlCode=null; shown=120;
  if(tab==='buy' && gi==null) tab='res';
  build(); renderInfo(); renderStrip();
}
function highlight(code){
  hlCode=code; tab='res'; renderTabs();
  const p=byCode.get(code);
  let list=currentList(); let idx=list.findIndex(x=>x.p.key===code);
  if(idx>=shown){ shown=idx+40; }
  renderStrip(); render();
  const el=document.querySelector(`.card[data-code="${CSS.escape(code)}"]`);
  if(el) el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}

/* ---------- bottom strip ---------- */
function currentList(){
  if(!R) return [];
  if(tab==='buy'){ const fg=focus!=null?G[focus]:(R.groups[0]&&R.groups[0].g); if(!fg) return [];
    return fg.b.flatMap(bi=>G[bi].prods.slice(0,30).map(p=>({p,rel:-1}))); }
  if(focus!=null){ const inRes=new Map(R.res.filter(r=>r.p.gi===focus).map(r=>[r.p.i,r]));
    const a=[...inRes.values()]; for(const p of G[focus].prods) if(!inRes.has(p.i)) a.push({p,rel:-1,buy:true}); return a; }
  return R.res;
}
function relTag(r){
  if(r.rel<0) return r.buy===undefined||tab==='buy'?'<span class="rel rb">ซื้อคู่กัน</span>':'<span class="rel r1">ในกลุ่มเดียวกัน</span>';
  if(R.fuzzy) return '<span class="rel r1">ใกล้เคียง</span>';
  return r.rel>.75?'<span class="rel r3">ตรงมาก</span>':r.rel>.4?'<span class="rel r2">ตรงบางส่วน</span>':'<span class="rel r1">เกี่ยวข้อง</span>';
}
function renderTabs(){
  const fg=focus!=null?G[focus]:(R&&R.groups[0]&&R.groups[0].g);
  const nb=fg?fg.b.reduce((a,bi)=>a+Math.min(30,G[bi].prods.length),0):0;
  $('#n-res').textContent=R?(focus!=null?G[focus].prods.length:R.res.length).toLocaleString():0;

  const f=$('#filter');
  if(focus!=null){ f.hidden=false; f.innerHTML=`${tab==='buy'?'ของที่ใช้คู่กับ':'กลุ่ม'}: <b>${esc(cut(G[focus].n,28))}</b> <button id="unf">ดูทั้งหมด ✕</button>`; $('#unf').onclick=()=>setFocus(null); }
  else if(tab==='buy'&&fg){ f.hidden=false; f.innerHTML=`ของที่ใช้คู่กับ: <b>${esc(cut(fg.n,28))}</b>`; }
  else f.hidden=true;
}
function renderStrip(){
  renderTabs();
  if(!$('#fs').hidden) renderFull();
  const list=currentList(), el=$('#strip');
  if(!R){ el.innerHTML='<div class="none">พิมพ์คำค้นหาด้านบนเพื่อดูสินค้า</div>'; return; }
  if(!list.length){ el.innerHTML=`<div class="none">${tab==='buy'?'กลุ่มนี้ยังไม่มีสินค้าที่แนะนำให้ซื้อคู่กัน':'ไม่พบสินค้า'}</div>`; return; }

function cardHTML(r){ const p=r.p, g=p.gi>=0?G[p.gi]:null, inC=cart[p.key];

   <div class="acts"><button class="ghost" id="clr"${codes.length?'':' disabled'}>ล้างตะกร้า</button><button class="primary" id="copy"${codes.length?'':' disabled'}>คัดลอกรายการสั่งซื้อ</button></div>`;
  $('#clr').onclick=()=>{cart={};saveCart();renderCart();renderStrip()};
  $('#copy').onclick=async()=>{ const txt=codes.map((c,i)=>{const p=byCode.get(c);return `${i+1}. ${p.name} [${p.code}] x ${cart[c]} ${p.unit||''}${p.price>0?' = ฿'+fmt(amt(p,cart[c])):' (สอบถามราคา)'}`}).join('\n')+`\nรวม ฿${fmt(total)}`;
    try{await navigator.clipboard.writeText(txt);toast('คัดลอกรายการแล้ว นำไปวางในแชตร้านได้เลย')}catch(e){toast('คัดลอกไม่สำเร็จ ลองอีกครั้ง')} };
}
$('#items').addEventListener('click',e=>{const t=e.target.dataset;
  if(t.i){cart[t.i]++} else if(t.d){cart[t.d]=Math.max(0,cart[t.d]-1); if(!cart[t.d]) delete cart[t.d]} else if(t.r){delete cart[t.r]} else return;
  saveCart();renderCart();renderStrip();});
$('#items').addEventListener('change',e=>{const c=e.target.dataset.q; if(!c) return; const v=Math.max(0,parseInt(e.target.value)||0); if(v) cart[c]=v; else delete cart[c]; saveCart();renderCart();renderStrip();});
const openCart=o=>document.body.classList.toggle('cart-open',o);
$('#cartbtn').onclick=()=>openCart(true); $('#close').onclick=()=>openCart(false); $('#scrim').onclick=()=>openCart(false);
let mCode=null;
function openModal(code){ mCode=code; const p=byCode.get(code), g=p.gi>=0?G[p.gi]:null, im=imgFor(p), list=$('#fs').hidden?currentList():fsList;
  const k=list.findIndex(r=>r.p.key===code);
  $('#mimg').innerHTML=(im?`<img src="${esc(im.src)}" alt="${esc(p.name)}" onerror="this.parentNode.querySelector('.noimg').hidden=false;this.remove()">${im.own?'':'<span class="src">รูปตัวอย่างของกลุ่มสินค้า</span>'}`:'')+
    `<div class="noimg"${im?' hidden':''}><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg>ยังไม่มีรูปสินค้านี้<br>สอบถามรูปเพิ่มเติมได้ที่ร้าน</div>`+
    (k>0?`<button class="mnav l" data-m="${k-1}" aria-label="สินค้าก่อนหน้า">‹</button>`:'')+(k>=0&&k<list.length-1?`<button class="mnav r" data-m="${k+1}" aria-label="สินค้าถัดไป">›</button>`:'');
  const inC=cart[code];
  $('#mdet').innerHTML=`<span class="code">${esc(p.code)}</span><h3>${esc(p.name)}</h3>
    <div class="pr">${priceHTML(p)}</div>
    <dl>${g?`<dt>กลุ่ม</dt><dd>${esc(g.n)}</dd>`:''}${g&&g.w?`<dt>ใช้สำหรับ</dt><dd>${esc(g.w)}</dd>`:''}${g&&g.d?`<dt>รายละเอียด</dt><dd>${esc(g.d)}</dd>`:''}
    ${g&&g.b.length?`<dt>ซื้อคู่กัน</dt><dd>${g.b.map(bi=>esc(G[bi].n)).join(', ')}</dd>`:''}</dl>
    <div class="acts"><button class="primary" id="madd">${inC?'✓ ในตะกร้า '+inC+' · เพิ่มอีก':'+ ใส่ตะกร้า'}</button>${g?'<button class="ghost" id="mgrp">ดูในกราฟ</button>':''}</div>`;
  $('#madd').onclick=()=>{addCart(code);openModal(code)};
  if(g) $('#mgrp').onclick=()=>{closeModal();closeFull();if(focus!==p.gi){focus=p.gi;build();renderInfo();renderTabs()}highlight(code)};
  $('#modal').hidden=false; $('#mclose').focus();
}
function closeModal(){ $('#modal').hidden=true; mCode=null; }
$('#mimg').addEventListener('click',e=>{const b=e.target.closest('[data-m]'); if(b) openModal(($('#fs').hidden?currentList():fsList)[+b.dataset.m].p.key)});
$('#mbd').onclick=closeModal; $('#mclose').onclick=closeModal;
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(mCode) closeModal(); else if(document.body.classList.contains('cart-open')) openCart(false); else if(!$('#fs').hidden) closeFull(); else if(!$('#conv').hidden) toggleConv(false); }
  if(mCode&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){ const b=document.querySelector(`.mnav.${e.key==='ArrowRight'?'r':'l'}`); if(b) b.click(); }
});

/* ---------- unit converter (length) ---------- */
const UNITS=[['mm','มิลลิเมตร (มม.)','มม.',1],['cm','เซนติเมตร (ซม.)','ซม.',10],['m','เมตร (ม.)','ม.',1000],['in','นิ้ว','นิ้ว',25.4],['hun','หุน (1/8 นิ้ว)','หุน',3.175],['ft','ฟุต','ฟุต',304.8],['wa','วา (2 ม.)','วา',2000]];
const U=Object.fromEntries(UNITS.map(u=>[u[0],u]));
['#cv-from','#cv-to'].forEach(sel=>$(sel).innerHTML=UNITS.map(u=>`<option value="${u[0]}">${u[1]}</option>`).join(''));
let CV={v:'100',f:'cm',t:'in'}; try{Object.assign(CV,JSON.parse(localStorage.getItem('conv-v1')||'{}'))}catch(e){}
$('#cv-v').value=CV.v; $('#cv-from').value=CV.f; $('#cv-to').value=CV.t;
const parseNum=t=>{ t=String(t).trim().replace(/,/g,'.'); let m;
  if((m=t.match(/^(\d+(?:\.\d+)?)\s+(\d+)\s*\/\s*(\d+)$/))) return +m[1]+ +m[2]/+m[3];
  if((m=t.match(/^(\d+)\s*\/\s*(\d+)$/))) return +m[1]/+m[2];
  return t&&isFinite(+t)?+t:NaN; };
const nf=n=>{ const a=Math.abs(n); const d=a>=1000?2:a>=1?4:6; return n.toLocaleString('th-TH',{maximumFractionDigits:d}); };
const inchFrac=v=>{ const e=Math.round(v*8), w=Math.floor(e/8), r=e%8; if(!r) return `${w}`; const g=r%4===0?4:r%2===0?2:1; return `${w?w+' ':''}${r/g}/${8/g}`; };
function convert(){
  const v=parseNum($('#cv-v').value), f=$('#cv-from').value, t=$('#cv-to').value;
  CV={v:$('#cv-v').value,f,t}; try{localStorage.setItem('conv-v1',JSON.stringify(CV))}catch(e){}
  if(isNaN(v)){ $('#cv-out').innerHTML='–'; $('#cv-alt').textContent=$('#cv-v').value.trim()?'พิมพ์เป็นตัวเลข เช่น 120, 2.5 หรือ 1 1/2':''; $('#cv-all').innerHTML=''; return; }
  const mm=v*U[f][3], out=mm/U[t][3];
  $('#cv-out').innerHTML=`${nf(out)} <small>${U[t][2]}</small>`;
  let alt=`${nf(v)} ${U[f][2]} = ${nf(out)} ${U[t][2]}`;
  const inch=mm/25.4;
  if(t==='in'&&Math.abs(inch*8-Math.round(inch*8))>1e-9) alt+=` · ประมาณ ${inchFrac(inch)} นิ้ว`;
  if(t==='ft'){ const ft=Math.floor(inch/12+1e-9), ri=inch-ft*12; alt+=` · = ${ft} ฟุต ${inchFrac(ri)} นิ้ว`; }
  $('#cv-alt').textContent=alt;
  $('#cv-all').innerHTML=UNITS.filter(u=>u[0]!==f).map(u=>`<span>${u[1]}</span><span>${nf(mm/u[3])}</span>`).join('');
}
function toggleConv(on){ $('#conv').hidden=!on; $('#convbtn').setAttribute('aria-expanded',String(on)); if(on){ convert(); $('#cv-v').focus(); $('#cv-v').select(); } }
$('#convbtn').onclick=()=>toggleConv($('#conv').hidden);
$('#cvclose').onclick=()=>toggleConv(false);
$('#cv-v').addEventListener('input',convert); $('#cv-from').onchange=convert; $('#cv-to').onchange=convert;
$('#cvswap').onclick=()=>{ const a=$('#cv-from').value; $('#cv-from').value=$('#cv-to').value; $('#cv-to').value=a; convert(); };
$('#cvpre').addEventListener('click',e=>{ const b=e.target.closest('[data-p]'); if(!b) return; const [a,c]=b.dataset.p.split(','); $('#cv-from').value=a; $('#cv-to').value=c; convert(); $('#cv-v').focus(); });

/* ---------- wiring ---------- */
function run(q){
  R=search(q); focus=R&&R.groups.length?R.groups[0].g.i:null; tab='res'; hlCode=null; shown=120;
  const s=$('#summary');
  if(!R) s.innerHTML=''; else if(!R.res.length) s.innerHTML='ไม่พบสินค้า';
  else s.innerHTML=`${R.fuzzy?'<span class="fz">ไม่พบคำตรงตัว แสดงผลที่ใกล้เคียง</span> ':''}พบ <b>${R.res.length.toLocaleString()}</b> รายการ ใน <b>${R.groups.length}</b> กลุ่ม`;
  build(); renderInfo(); renderStrip();
}
/* phones: while typing, the search bar widens over the app name and the ลองค้นหา row hides */
const setSearching=on=>document.body.classList.toggle('searching',on);
$('#q').addEventListener('focus',()=>setSearching(true));
$('#q').addEventListener('blur',()=>setTimeout(()=>{ if(document.activeElement!==$('#q')) setSearching(false); },120));
let deb; $('#q').addEventListener('input',e=>{clearTimeout(deb);deb=setTimeout(()=>run(e.target.value),180)});
$('#sform').addEventListener('submit',e=>{e.preventDefault();run($('#q').value)});
$('#clear').onclick=()=>{$('#q').value='';run('');$('#q').focus()};
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{$('#q').value=c.dataset.q;run(c.dataset.q)});
$('#fit').onclick=()=>fit();
window.addEventListener('resize',()=>fit(0));
renderCart();
$('#q').value='ซิลิโคน'; run('ซิลิโคน');
})();
</script>
